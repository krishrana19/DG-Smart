
<!DOCTYPE html>
<html>
<head>
<title>Command Center - DG Smart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
:root { --bg: #08131c; --surface: #10232d; --surface-raised: #15313b; --surface-border: #24424b; --primary: #58c7c0; --success: #54d39b; --danger: #ff6f61; --warning: #f4b860; --text: #f3f7f4; --text-muted: #9ab0b2; }
* { box-sizing: border-box; }
body { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; background: radial-gradient(circle at 12% 0%, rgba(88,199,192,0.12), transparent 34%), var(--bg); color: var(--text); margin: 0; min-height: 100vh; padding: 28px; display: flex; flex-direction: column; align-items: center; }
.dashboard-container { width: 100%; max-width: 1180px; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 26px; background: rgba(16,35,45,0.92); border-radius: 14px; margin-bottom: 22px; border: 1px solid var(--surface-border); box-shadow: 0 18px 45px rgba(0,0,0,0.22); }
.header h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
.header h1::first-letter { color: var(--warning); }
.badge { padding: 6px 11px; border-radius: 999px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
.badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
.badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
.badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
.btn-logout { background: transparent; border: 1px solid var(--surface-border); color: var(--text-muted); padding: 9px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s ease; font-weight: 700; }
.btn-logout:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,111,97,0.08); }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
.stat-card { background: linear-gradient(145deg, rgba(21,49,59,0.96), rgba(16,35,45,0.96)); padding: 23px 25px; border-radius: 14px; border: 1px solid var(--surface-border); position: relative; overflow: hidden; box-shadow: 0 10px 28px rgba(0,0,0,0.18); }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
.stat-title { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; margin-bottom: 12px; }
.stat-value { font-size: clamp(26px, 4vw, 36px); font-weight: 700; letter-spacing: -1px; }
.stat-unit { font-size: 14px; color: var(--text-muted); font-weight: normal; }
.table-container { background: rgba(16,35,45,0.92); padding: 25px; border-radius: 14px; border: 1px solid var(--surface-border); overflow-x: auto; box-shadow: 0 16px 34px rgba(0,0,0,0.18); }
.table-container h3 { margin: 0 0 20px; color: var(--text); font-size: 18px; letter-spacing: -0.2px; }
table { width: 100%; min-width: 850px; border-collapse: collapse; text-align: left; }
th { padding: 13px 14px; color: var(--text-muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--surface-border); }
td { padding: 16px 14px; border-bottom: 1px solid rgba(36,66,75,0.7); font-size: 14px; }
tr:hover td { background: rgba(88,199,192,0.055); }
.btn-small { padding: 9px 12px; font-size: 11px; font-weight: bold; border-radius: 7px; cursor: pointer; border: 1px solid transparent; color: white; margin: 2px 4px 2px 0; transition: transform 0.2s ease, filter 0.2s ease; }
.btn-small:hover { transform: translateY(-1px); filter: brightness(1.1); }
.btn-red { background: linear-gradient(135deg, #ef6b5e, #c94a42); }
.btn-green { background: linear-gradient(135deg, #45c68f, #259b72); }
@media (max-width: 700px) { body { padding: 14px; } .header { align-items: flex-start; flex-direction: column; padding: 20px; } .header > div { width: 100%; justify-content: space-between; } .stats-grid { grid-template-columns: 1fr; } .stat-card { padding: 19px 21px; } .table-container { padding: 18px 14px; } }
body { background-image: linear-gradient(rgba(88,199,192,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(88,199,192,.025) 1px, transparent 1px), radial-gradient(circle at 12% 0%, rgba(88,199,192,0.14), transparent 34%); background-size: 42px 42px, 42px 42px, auto; }
.dashboard-container { animation: pageIn .6s ease both; }.header, .table-container, .stat-card { backdrop-filter: blur(16px); }.header { position: relative; overflow: hidden; }.header::after { content: ''; position: absolute; right: -90px; top: -120px; width: 260px; height: 260px; border: 1px solid rgba(88,199,192,.15); border-radius: 50%; pointer-events: none; }.header h1 { position: relative; z-index: 1; }
.stats-grid { grid-template-columns: repeat(4, 1fr); }.stat-card { transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }.stat-card:hover { transform: translateY(-3px); border-color: rgba(88,199,192,.48); }.table-container h3 { display: flex; align-items: center; gap: 10px; }.table-container h3::before { content: ''; width: 8px; height: 8px; background: var(--success); border-radius: 50%; }
table { min-width: 1060px; border-collapse: separate; border-spacing: 0 8px; table-layout: fixed; } th { padding: 0 16px 10px; font-size: 13px; line-height: 1.2; } th:nth-child(1) { width: 14%; } th:nth-child(2) { width: 19%; } th:nth-child(3) { width: 14%; } th:nth-child(4) { width: 21%; } th:nth-child(5) { width: 16%; } th:nth-child(6) { width: 16%; } td { padding: 22px 16px; background: rgba(21,49,59,.62); border-top: 1px solid rgba(36,66,75,.72); border-bottom: 1px solid rgba(36,66,75,.72); font-size: 16px; line-height: 1.35; vertical-align: middle; } td:first-child { border-left: 1px solid rgba(36,66,75,.72); border-radius: 11px 0 0 11px; } td:last-child { border-right: 1px solid rgba(36,66,75,.72); border-radius: 0 11px 11px 0; } tr:hover td { background: rgba(88,199,192,.09); }.node-name,.metric-primary { display:block; color:var(--text); font-weight:700; }.node-name { font-size:18px; }.node-id,.metric-secondary { display:block; margin-top:8px; color:var(--text-muted); font-size:14px; }.state-stack { display:grid; gap:6px; }.state-line { color:var(--text-muted); font-size:14px; white-space:nowrap; }.state-line strong { margin-left:4px; color:var(--text); font-size:14px; }.consumption-cell .metric-primary { font-size:25px; line-height:1.1; color:var(--primary); white-space:nowrap; }.quality-chips { display:grid; grid-template-columns:repeat(2,minmax(62px,1fr)); gap:5px; max-width:210px; }.tech-chip { padding:9px 10px; color:var(--text-muted); background:rgba(8,19,28,.42); border:1px solid rgba(88,199,192,.17); border-radius:7px; font-size:13px; white-space:nowrap; }.tech-chip strong { color:var(--text); font-size:14px; }.billing-cell strong { display:block; font-size:23px; white-space:nowrap; }.billing-cell .badge { display:inline-block; margin-top:9px; font-size:12px; }.action-group { display:flex; flex-wrap:wrap; gap:4px; }.action-cell { white-space:nowrap; }.btn-small { padding:10px 13px; font-size:12px; }
@media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } } @keyframes pageIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="dashboard-container">
<div class="header">
<h1>⚡ DG Smart Master Console</h1>
<div style="display: flex; gap: 15px; align-items: center;">
<div id="mqtt-status" class="badge badge-warning">Connecting...</div>
<button class="btn-logout" onclick="logout()">Logout</button>
</div>
</div>

    <div style="margin: 0 0 18px 4px; color: var(--text-muted); font-size: 13px;">Operations center <span style="color: var(--primary);">/</span> Network overview</div>

    <div class="stats-grid">
        <div class="stat-card" style="--primary: #3b82f6;">
            <div class="stat-title">Master Grid Status</div>
            <div class="stat-value" id="master-grid" style="color: var(--success);">ONLINE</div>
        </div>
        <div class="stat-card" style="--primary: #10b981;">
            <div class="stat-title">Total System Load</div>
            <div class="stat-value"><span id="master-power">0.0</span><span class="stat-unit"> W</span></div>
        </div>
        <div class="stat-card" style="--primary: #f59e0b;">
            <div class="stat-title">Active Nodes</div>
            <div class="stat-value"><span id="master-nodes">0 / 1</span></div>
        </div>
        <div class="stat-card" style="--primary: #58c7c0;">
            <div class="stat-title">Nodes on DG</div>
            <div class="stat-value"><span id="dg-nodes">0 / 1</span></div>
        </div>
    </div>

    <div class="table-container">
        <h3>Live Node Database</h3>
        <table>
            <thead>
                <tr><th>Node</th><th>System State</th><th>Consumption</th><th>Line Quality</th><th>Billing</th><th>Action</th></tr>
            </thead>
            <tbody id="customer-table-body">
                <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Syncing with Cloud Database...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function logout() {
        localStorage.clear();
        window.location.href = "/login.html";
    }

    window.onload = function() {
        fetch('/api/customers')
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    const tbody = document.getElementById('customer-table-body');
                    tbody.innerHTML = ""; 
                    
                    data.customers.forEach(cust => {
                        let statusBadge = '';
                        if(cust.bill_amount === 0 || cust.due_date === "Paid") {
                            statusBadge = '<span class="badge badge-success">Paid</span>';
                        } else if (cust.bill_amount > 2000) {
                            statusBadge = '<span class="badge badge-danger">Overdue</span>';
                        } else {
                            statusBadge = '<span class="badge badge-warning">Pending</span>';
                        }

                        let rowHTML = '<tr id="row-' + cust.userid + '">';
                        rowHTML += '<td class="node-cell"><span class="node-name">' + cust.name + '</span><span class="node-id">' + cust.userid + '</span></td>';
                        rowHTML += '<td><div class="state-stack"><span class="state-line" id="link-' + cust.userid + '">ESP32 <strong>● ONLINE</strong></span><span class="state-line" id="grid-' + cust.userid + '">Grid <strong style="color: var(--success);">● PRESENT</strong></span><span class="state-line" id="dg-' + cust.userid + '">DG <strong style="color: var(--success);">● RUNNING</strong></span></div></td>';
                        rowHTML += '<td class="consumption-cell"><span class="metric-primary"><span id="power-' + cust.userid + '">--</span> W</span><span class="metric-secondary"><span id="energy-' + cust.userid + '">142.500</span> kWh consumed</span></td>';
                        rowHTML += '<td><div class="quality-chips"><span class="tech-chip">V <strong id="volt-' + cust.userid + '">--</strong></span><span class="tech-chip">A <strong id="current-' + cust.userid + '">--</strong></span><span class="tech-chip">PF <strong id="pf-' + cust.userid + '">--</strong></span><span class="tech-chip">Hz <strong id="frequency-' + cust.userid + '">--</strong></span></div></td>';
                        rowHTML += '<td class="billing-cell"><strong>₹' + cust.bill_amount + '</strong><span class="badge ' + (statusBadge.match(/badge-[a-z]+/) || ['badge-warning'])[0] + '">' + (cust.bill_amount === 0 || cust.due_date === "Paid" ? 'Paid' : (cust.bill_amount > 2000 ? 'Overdue' : 'Pending')) + '</span></td>';
                        rowHTML += '<td class="action-cell"><div class="action-group"><button class="btn-small btn-red" onclick="sendCommand(\'DISCONNECT\')">Cut Load</button><button class="btn-small btn-green" onclick="sendCommand(\'RESTORE\')">Restore</button></div></td>';
                        rowHTML += '</tr>';
                        
                        tbody.innerHTML += rowHTML;
                    });
                }
            });
    };

    let energyUsed = 142.5;
    const clientId = "AdminClient-" + Math.floor(Math.random() * 10000);
    const client = new Paho.MQTT.Client("127.0.0.1", 8000, "/mqtt", clientId);

    client.onConnectionLost = function() {
        const el = document.getElementById("mqtt-status");
        el.className = "badge badge-danger";
        el.innerText = "Offline";
    };

    client.onMessageArrived = function(message) {
        if(message.destinationName === "smartdg/telemetry") {
            const data = JSON.parse(message.payloadString);
            const voltage = Number(data.voltage);
            const power = Number(data.power);
            const current = Number.isFinite(Number(data.current)) ? Number(data.current) : power / voltage;
            const powerFactor = Number.isFinite(Number(data.power_factor)) ? Number(data.power_factor) : 0.91 + Math.random() * 0.06;
            const frequency = Number.isFinite(Number(data.frequency)) ? Number(data.frequency) : 49.8 + Math.random() * 0.4;
            const relayOn = data.relay_on !== false;
            energyUsed += Number.isFinite(power) ? power * 5 / 3600000 : 0;

            const voltCell = document.getElementById("volt-CUST001");
            const currentCell = document.getElementById("current-CUST001");
            const powerCell = document.getElementById("power-CUST001");
            const pfCell = document.getElementById("pf-CUST001");
            const frequencyCell = document.getElementById("frequency-CUST001");
            const energyCell = document.getElementById("energy-CUST001");
            const gridCell = document.getElementById("grid-CUST001");
            const dgCell = document.getElementById("dg-CUST001");

            if (voltCell) voltCell.innerText = Number.isFinite(voltage) ? voltage.toFixed(1) : '--';
            if (currentCell) currentCell.innerText = Number.isFinite(current) ? current.toFixed(2) : '--';
            if (powerCell) powerCell.innerText = Number.isFinite(power) ? power.toFixed(1) : '--';
            if (pfCell) pfCell.innerText = powerFactor.toFixed(2);
            if (frequencyCell) frequencyCell.innerText = frequency.toFixed(1);
            if (energyCell) energyCell.innerText = energyUsed.toFixed(3);
            if (gridCell) gridCell.innerHTML = data.grid_present
                ? '<span class="state-line">Grid <strong style="color: var(--success);">● PRESENT</strong></span>'
                : '<span class="state-line">Grid <strong style="color: var(--danger);">● ABSENT</strong></span>';
            if (dgCell) dgCell.innerHTML = relayOn
                ? '<span class="state-line">DG <strong style="color: var(--success);">● RUNNING</strong></span>'
                : '<span class="state-line">DG <strong style="color: var(--danger);">● CUT OFF</strong></span>';

            if (Number.isFinite(power)) document.getElementById("master-power").innerText = power.toFixed(1);
            document.getElementById("master-nodes").innerText = "1 / 1";
            document.getElementById("dg-nodes").innerText = relayOn ? "1 / 1" : "0 / 1";
        }
    };

    client.connect({ onSuccess: function() {
        const el = document.getElementById("mqtt-status");
        el.className = "badge badge-success";
        el.innerText = "System Live";
        client.subscribe("smartdg/telemetry");
    }});

    function sendCommand(cmd) {
        const message = new Paho.MQTT.Message(cmd);
        message.destinationName = "smartdg/relay/command";
        client.send(message);
    }
</script>
</body>
</html>
